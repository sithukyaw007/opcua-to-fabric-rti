name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q tests/test_bridge.py

      - name: Start the OPC PLC simulator
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            python -c "import socket; socket.create_connection(('localhost', 50000), 2)" && exit 0
            sleep 2
          done
          docker logs opcplc
          exit 1

      - name: Integration tests against the simulator
        env:
          OPCUA_TEST_URL: opc.tcp://localhost:50000
        run: pytest -q tests/test_opcua_simulator.py

      - name: Command-line smoke test (browse and dry run)
        run: |
          python src/opcua_to_eventstream.py --browse --browse-root "ns=3;s=OpcPlc" | tee browse.txt
          grep -q "ns=3;s=SpikeData" browse.txt
          python src/opcua_to_eventstream.py --dry-run --duration 10 | tee events.jsonl
          test "$(grep -c '"machineId"' events.jsonl)" -gt 5

      - name: Simulator logs
        if: failure()
        run: docker logs opcplc
